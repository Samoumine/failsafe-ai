# Solace Agent Mesh Agent Configuration

log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: a2a_agent.log

apps:
  - name: "FailsafePolicy__app"
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8008}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

    app_config:
      namespace: "${NAMESPACE}"
      supports_streaming: false
      agent_name: "FailsafePolicy"
      display_name: "Failsafe Policy Agent"
      model:
        model: ${LLM_SERVICE_GENERAL_MODEL_NAME}
        api_base: ${LLM_SERVICE_ENDPOINT}
        api_key: ${LLM_SERVICE_API_KEY}
        cache_strategy: "5m"

      instruction: |
        Input is {"riskScore":...,"riskFactors":[...]}
        Decide mode:
        
        risk >= 0.75 -> MANUAL_CONFIRM
        
        risk >= 0.50 -> EXPLAIN_ONLY
        
        else -> ASSIST
        Return STRICT JSON only:
        {"mode":"ASSIST|EXPLAIN_ONLY|MANUAL_CONFIRM","reason":string,"guardrails":[string]}
      
      tools: 
        - tool_type: builtin-group
          group_name: artifact_management

      session_service: 
        type: "sql"
        default_behavior: "PERSISTENT"
        database_url: "${FAILSAFE_POLICY_DATABASE_URL, sqlite:///failsafe_policy.db}"
      artifact_service:
        type: "filesystem"
        base_path: "/tmp/samv2"
        artifact_scope: namespace
      
      artifact_handling_mode: "reference"
      enable_embed_resolution: true
      enable_artifact_content_instruction: true
      data_tools_config:
        sqlite_memory_threshold_mb: 100
        max_result_preview_rows: 50
        max_result_preview_bytes: 4096

      # Agent Card Definition
      agent_card:
        description: |
          Selects the appropriate human–automation mode based on risk.
        defaultInputModes: [text] 
        defaultOutputModes: [text, file] 
        skills: []
      
      # Discovery & Communication
      agent_card_publishing: 
        interval_seconds: 10
      agent_discovery: 
        enabled: true
      inter_agent_communication:
        allow_list: ["*"] 
        deny_list: [] 
        request_timeout_seconds: 600
