# Solace Agent Mesh Agent Configuration

log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: a2a_agent.log

apps:
  - name: "FailsafeMonitor__app"
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8008}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

    app_config:
      namespace: "${NAMESPACE}"
      supports_streaming: false
      agent_name: "FailsafeMonitor"
      display_name: "Failsafe Monitor Agent"
      model:
        model: ${LLM_SERVICE_GENERAL_MODEL_NAME}
        api_base: ${LLM_SERVICE_ENDPOINT}
        api_key: ${LLM_SERVICE_API_KEY}
        cache_strategy: "5m"

      instruction: |
        You receive a JSON payload describing a Tetris board state and player interaction signals.
        Return STRICT JSON only with computed features:
        
        holes (int)
        
        maxHeight (int)
        
        bumpiness (int)
        
        wells (int)
        
        topOutDanger (0..1)
        
        reliance (0..1) from metrics: low engagement + blindAccept streak + hesitation
        
        notes: short array of strings
        Use conservative estimates. Do not hallucinate.
        Output schema:
        {"holes":int,"maxHeight":int,"bumpiness":int,"wells":int,"topOutDanger":number,"reliance":number,"notes":[string]}
      
      tools: 
        - tool_type: builtin-group
          group_name: artifact_management

      session_service: 
        type: "sql"
        default_behavior: "PERSISTENT"
        database_url: "${FAILSAFE_MONITOR_DATABASE_URL, sqlite:///failsafe_monitor.db}"
      artifact_service:
        type: "filesystem"
        base_path: "/tmp/samv2"
        artifact_scope: namespace
      
      artifact_handling_mode: "reference"
      enable_embed_resolution: true
      enable_artifact_content_instruction: true
      data_tools_config:
        sqlite_memory_threshold_mb: 100
        max_result_preview_rows: 50
        max_result_preview_bytes: 4096

      # Agent Card Definition
      agent_card:
        description: |
          Extracts structured safety and board-state signals from gameplay events.
        defaultInputModes: [text] 
        defaultOutputModes: [text, file] 
        skills: []
      
      # Discovery & Communication
      agent_card_publishing: 
        interval_seconds: 10
      agent_discovery: 
        enabled: true
      inter_agent_communication:
        allow_list: ["*"] 
        deny_list: [] 
        request_timeout_seconds: 600
